<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5f1"><title>Link Board · 链接收藏</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./"><span class="logo">↗</span> Link Board</a><span class="private">你的私人链接画布 · 数据保存在此浏览器</span><button id="add" class="primary">＋ 收藏链接</button></header>
<main class="workspace">
<aside class="panel"><div class="eyebrow">YOUR PERSONAL LINK CANVAS</div><h1>灵感画布</h1><p class="panel-description">把好链接放在一起，自由整理你的想法。</p>
<form id="quick-save" class="quick-save"><label for="quick-url">随手收藏</label><input id="quick-url" name="url" placeholder="粘贴链接直接收藏，或输入后回车…" aria-label="快速收藏链接" required maxlength="4096"><button class="primary" type="submit">收藏 ↗</button></form>
<label class="search"><input id="search" type="search" placeholder="搜索画布…" aria-label="搜索收藏"><kbd>/</kbd></label>
<nav id="tags" aria-label="标签筛选"></nav><div class="section-head"><h2>画布链接 <span id="count">0</span></h2></div><select id="sort" aria-label="排序" hidden><option value="new">最近收藏</option></select>
<div class="backup-actions"><button id="import">导入</button><button id="export">导出备份 ↗</button></div><p class="instructions">⌘V / Ctrl+V 粘贴链接即收藏<br>拖动卡片自由摆放<br>拖动空白处平移画布<br>滚轮缩放 · 双击空白处收藏<br>方向键微调已选中的卡片</p></aside>
<section id="viewport" aria-label="链接画布"><div id="cards" aria-live="polite"></div><section id="empty" hidden><div class="empty-icon">↗</div><h2>给好链接留个位置</h2><p>粘贴链接，直接收藏到画布。</p><button id="first" class="primary">收藏第一个链接</button></section><div class="canvas-label">LINK BOARD <span> / 自由连接每一个想法</span></div></section>
<div class="canvas-controls" aria-label="画布控制"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-level">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应画布</button><button id="reset-view">重置视图</button></div></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="dialog-title">收藏新链接</h2><button type="button" id="close" aria-label="关闭">✕</button></div><label>网页链接<input name="url" type="text" placeholder="https://example.com" required maxlength="4096"></label><label>标题<input name="title" placeholder="可选，默认使用网站域名" maxlength="200"></label><label>标签<input name="tags" placeholder="工具, 设计, 稍后阅读" maxlength="300"><small>使用逗号分隔，可填写多个标签</small></label><label>笔记<textarea name="note" placeholder="为什么想收藏它？" maxlength="2000" rows="3"></textarea></label><p id="error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存收藏</button></div></form></dialog>
<input id="file" type="file" accept="application/json,.json" hidden><div id="toast" role="status" hidden></div><script type="module" src="app.js"></script><script type="module" src="canvas.js"></script></body></html>
